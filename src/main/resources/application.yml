# Server properties
server:
  port: 8080

# Information for the info endpoint
info:
  app:
    environment: DEV
    name: ${spring.application.name}
    description: API Gateway - Local Instance

# Spring application properties
spring:
  application:
    name: infra-gateway
  profiles:
    active: dev
  config:
    import:
      - optional:configserver:discovery://config-server
      - optional:file:./env.properties
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

# Eureka configuration
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_DEFAULT_ZONE}
  instance:
    preferIpAddress: true

# Management properties
management:
  info:
    env:
      enabled: true
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: info, health, refresh, gateway, prometheus
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: streamix
      deployment.environment: ${spring.profiles.active}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT}
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_ENDPOINT}

app:
  allowedOrigins: ${ALLOWED_ORIGINS}
  accessTokenSecret: ${ACCESS_TOKEN_SECRET}
  frontendBaseUrl: ${FRONTEND_BASE_URL}

# Logging properties
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
    com.mariuszilinskas: DEBUG
