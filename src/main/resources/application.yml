# Server properties
server:
  port: 8080

# Information for the info endpoint
info:
  app:
    environment: DEV
    name: ${spring.application.name}
    description: API Gateway - Local Instance

# Spring application properties
spring:
  application:
    name: infra-gateway
  profiles:
    active: dev
  config:
    import:
      - optional:configserver:discovery://config-server
      - optional:file:../env/dev.properties
      - classpath:gateway-routes.yml
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

# Eureka configuration
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_DEFAULT_ZONE}
  instance:
    preferIpAddress: true

# Management properties
management:
  info:
    env:
      enabled: true
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: info, health, refresh, gateway, prometheus
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: streamix
      deployment.environment: ${spring.profiles.active}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT}
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_ENDPOINT}

app:
  allowedOrigins: ${ALLOWED_ORIGINS}
  accessTokenSecret: ${ACCESS_TOKEN_SECRET}
  frontendBaseUrl: ${FRONTEND_BASE_URL}
  cluster-keys:
    AUTH: ${AUTH_CLUSTER_KEY}
    USERS: ${USERS_CLUSTER_KEY}
    MEDIA: ${MEDIA_CLUSTER_KEY}
    DISCOVERY: ${DISCOVERY_CLUSTER_KEY}
    STREAMING: ${STREAMING_CLUSTER_KEY}
    BILLING: ${BILLING_CLUSTER_KEY}

# Logging properties
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
    com.mariuszilinskas: DEBUG
