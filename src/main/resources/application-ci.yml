# Eureka configuration for CI
eureka:
  client:
    fetchRegistry: false
    registerWithEureka: false

# Management configuration for CI
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

# App configuration for CI
app:
  allowedOrigins: http://localhost:3000
  accessTokenSecret: dummy-secret-key
  frontendBaseUrl: http://localhost:3000
  cluster-keys:
    AUTH:      dummy-auth-key
    USERS:     dummy-users-key
    MEDIA:     dummy-media-key
    DISCOVERY: dummy-discovery-key
    STREAMING: dummy-streaming-key
    BILLING:   dummy-billing-key
